# pairs_1 on gold miners vs GDX — NEM mean reversion against sector ETF
# Run: qbt run alpaca_sectors_pairs1

strategy       = pairs_1
data           = qi.alpaca
universe       = pairs_gold.csv

interval       = 1d
start          = 2022.01.03D00:00
end            = 2024.12.31D00:00
warmup         = auto

enter_at       = next_open
enter_slip     = 5bps
exit_at        = next_open
