# TSLA Mean Reversion (Long + Short) — Ernest Chan BB/RSI approach
# Fade Bollinger Band extremes on both sides: long oversold touches, short overbought.
# TSLA's high volatility creates frequent, reliable mean-reversion setups.
# Run: qbt run chan_mr_spy

strategy       = index_mr
data           = qi.alpaca
universe       = spy.txt

interval       = 1d
start          = 2018.01.02D00:00
end            = 2024.12.31D00:00
warmup         = auto

enter_at       = next_open
enter_slip     = 5bps
exit_at        = next_open
exit_slip      = 5bps

initial_equity = 100000
leverage       = 1.0
fees           = 5bps
