# Trend Momentum on Large-Cap Tech — Ernest Chan style
# Buy leading tech names when they are in an uptrend (above SMA) and pull back to an
# RSI entry level. Ride the momentum; exit when the trend breaks or stop is hit.
# Universe: MSFT, TSLA, AAPL
# Run: qbt run chan_momentum

strategy       = momentum_1
data           = qi.alpaca
universe       = msft.txt

interval       = 1d
start          = 2018.01.02D00:00
end            = 2024.12.31D00:00
warmup         = auto

enter_at       = next_open
enter_slip     = 5bps
exit_at        = next_open
exit_slip      = 5bps

initial_equity = 100000
leverage       = 1.0
fees           = 5bps
