# mr_1 on Binance crypto — long-only SMA(10000) mean reversion on 1m bars
# Sharpe: BTC 0.61 / ETH 0.63 / SOL 0.62  |  Win rate 30-40%  |  DD ~2%

strategy       = mr_1
universe       = crypto.txt

# data          = /path/to/hdb
# bars          = Bar1m
# or use qi data hooks
data           = qi.binance
interval       = 1m     # derives bar table name

start          = 2026.02.01D00:00
end            = 2026.04.30D23:59
warmup         = auto

enter_at       = next_open
enter_slip     = 2bps
exit_at        = next_open
exit_slip      = 2bps

initial_equity = 10000
leverage       = 1.0
fees           = 4bps
