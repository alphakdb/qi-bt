# pairs_1 on Binance crypto — BTC/ETH spread mean reversion
# Run: qbt run binance_pairs1

strategy       = pairs_1
data           = qi.binance
universe       = pairs_crypto.csv

interval       = 1m
start          = 2025.01.01D00:00
end            = 2025.03.31D00:00
warmup         = auto

enter_at       = next_open
enter_slip     = 5bps
exit_at        = next_open
exit_slip      = 5bps

initial_equity = 10000
leverage       = 1.0
fees           = 10bps
